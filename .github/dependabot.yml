version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint accepts only TypeScript below 6.1, so a TypeScript major breaks `npm ci`.
      # Move TypeScript by hand once typescript-eslint supports the new version.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # The packages support Node 22.18 and newer (`engines`). Types for a newer Node would accept
      # APIs that Node 22 does not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for every action. github/codeql-action/init and /analyze must be the same version,
      # and a separate PR for each fails CodeQL.
      github-actions:
        patterns: ["*"]

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  release:
    name: publish GitHub Release
    needs: [ci, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag must match package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$version" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi
      - name: Build source archive and checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix="agentdock-cli-${TAG}/" -o "dist/agentdock-cli-${TAG}.tar.gz" HEAD
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --generate-notes --title "$TAG"
